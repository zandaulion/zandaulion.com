<body>
    <div class="bg-glow"></div>
    <portfolio-header active-page="sankey.html"></portfolio-header>

    <main id="main" class="sankey-main">
        <a class="back-link" href="index.html#collection" hreflang="zh-CN">← 返回工作坊</a>
        <div class="sankey-editor-layout">

            <!-- Left Panel: Controls -->
            <div class="sankey-controls card">
                <h1>Sankey 编辑</h1>

                <h3 style="margin-bottom: 16px; font-weight: 700;">数据与导出</h3>
                <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px;">
                    <button id="btn-export" class="btn btn-outline" style="width: 100%;">导出为图像</button>
                    <div style="display: flex; gap: 10px;">
                        <button id="btn-export-json" class="btn btn-outline" style="flex: 1; font-size: 0.9rem;">出口 JSON</button>
                        <button id="btn-import-json" class="btn btn-outline" style="flex: 1; font-size: 0.9rem;">进口JSON</button>
                    </div>
                    <button id="btn-reset" class="btn btn-outline" style="width: 100%; border-color: rgba(255, 56, 56, 0.3); color: var(--accent-red);">重置图</button>
                    <a href="https://github.com/zandaulion/zandaulion.com" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="width: 100%; text-align: center; font-size: 0.9rem;">在 GitHub 上查看</a>
                    <input type="file" id="import-file-input" accept=".json" style="display: none;">
                </div>

                <!-- Nodes Section -->
                <div class="editor-section">
                    <h3 style="margin-bottom: 16px; font-weight: 700;">图表数据</h3>
                    <h3>节点</h3>
                    <div class="input-group" style="flex-direction: column;">
                        <input type="text" id="node-name" placeholder="节点名称">
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="color" id="node-color" value="#00d2ff" title="节点颜色" disabled>
                            <label style="display:flex; align-items:center; gap: 4px; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; flex: 1;">
                                <input type="checkbox" id="auto-color" checked> 汽车
                            </label>
                            <button id="add-node-btn" class="btn btn-primary" style="flex: 1;">添加节点</button>
                        </div>
                    </div>
                    <ul id="nodes-list" class="item-list">
                        <!-- Nodes populated via JS -->
                    </ul>
                </div>

                <!-- Links Section -->
                <div class="editor-section">
                    <h3>友情链接</h3>
                    <div class="input-group stacked-inputs">
                        <select id="link-source">
                            <option value="" disabled selected>源节点</option>
                        </select>
                        <select id="link-target">
                            <option value="" disabled selected>目标节点</option>
                        </select>
                        <input type="number" id="link-value" placeholder="值（例如 10）" min="1">
                        <button id="add-link-btn" class="btn btn-primary">添加链接</button>
                    </div>
                    <ul id="links-list" class="item-list">
                        <!-- Links populated via JS -->
                    </ul>
                </div>

            </div>

            <!-- Right Panel: Preview -->
            <div class="sankey-preview card" style="display: flex; flex-direction: column; overflow: hidden; padding-top: 16px; padding-bottom: 0;">
                <div style="display: flex; align-items: center; justify-content: flex-end; margin-bottom: 16px; gap: 24px; padding: 0 24px; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <label for="height-slider" style="font-size: 0.9rem; color: var(--text-muted); white-space: nowrap;">画布高度： <span id="height-display">100</span>%</label>
                        <input type="range" id="height-slider" min="100" max="500" value="100" style="width: 120px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <label for="width-slider" style="font-size: 0.9rem; color: var(--text-muted); white-space: nowrap;">画布宽度： <span id="width-display">100</span>%</label>
                        <input type="range" id="width-slider" min="100" max="500" value="100" style="width: 120px;">
                    </div>
                </div>
                <div style="overflow: auto; width: 100%; height: 800px; padding-bottom: 24px;">
                    <div id="echarts-container" style="width: 100%; height: 800px; min-width: 100%;"></div>
                </div>
            </div>

        </div>
    <section class="related-projects wrap" aria-labelledby="related-title">
        <div class="section-heading"><div><span class="section-number">继续发现</span><h2 id="related-title">你可能还会喜欢…</h2></div><p><a href="index.html#collection" hreflang="zh-CN">查看全部作品 ↗</a></p></div>
        <div class="collection-grid">
<article class="collection-card" data-category="creative">
          <a href="kerfloom.html" hreflang="zh-CN">
            <div class="collection-image"><img src="../assets/Kerfloom/feature_graphic.jpg" alt="" loading="lazy" decoding="async" width="800" height="420"></div>
            <div class="collection-tag">创作工具</div>
            <h3>Kerfloom <span aria-hidden="true">↗</span></h3>
            <p>把照片变成相互连接的图案，用于金属切割。</p>
          </a>
        </article>
<article class="collection-card" data-category="everyday">
          <a href="miscare.html" hreflang="zh-CN">
            <div class="collection-image"><img src="../assets/Miscare/feature_graphic.jpg" alt="" loading="lazy" decoding="async" width="800" height="420"></div>
            <div class="collection-tag">日常工具</div>
            <h3>Mișcare <span aria-hidden="true">↗</span></h3>
            <p>利用已有的器材，给今天添一点运动。</p>
          </a>
        </article>
<article class="collection-card" data-category="play">
          <a href="gravitywarp.html" hreflang="zh-CN">
            <div class="collection-image collection-image-hero"><img src="../assets/GravityWarp/workshop-hero.png" alt="" loading="lazy" decoding="async" width="800" height="420"></div>
            <div class="collection-tag">玩乐与探索</div>
            <h3>Gravity Warp <span aria-hidden="true">↗</span></h3>
            <p>在复古物理街机游戏中穿行于引力井之间。</p>
          </a>
        </article>
        </div>
    </section>
